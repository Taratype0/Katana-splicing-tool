ilter is applied.</p><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><script id="table-data" type="application/json">__DATA__</script><script>const D=JSON.parse(document.getElementById('table-data').textContent),$=id=>document.getElementById(id);let rows=D.rows,page=0,sort=null,ascending=true;const value=x=>x===null||x===undefined||x===''?'NA':String(x);function draw(){let r=rows;if(sort!==null)r=[...r].sort((a,b)=>{const x=a[sort],y=b[sort];if(x===null||x==='')return 1;if(y===null||y==='')return -1;const numeric=/^-?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i;return (numeric.test(String(x))&&numeric.test(String(y))?Number(x)-Number(y):String(x).localeCompare(String(y)))*(ascending?1:-1)});const max=Math.max(1,Math.ceil(r.length/75));page=Math.min(Math.max(0,page),max-1);$('count').textContent=`${r.length.toLocaleString()} / ${D.rows.length.toLocaleString()} rows · page ${page+1} / ${max}`;$('body').replaceChildren(...r.slice(page*75,page*75+75).map(row=>{const tr=document.createElement('tr');for(let i=0;i<D.columns.length;i++){const td=document.createElement('td');td.textContent=value(row[i]);td.title=value(row[i]);tr.append(td)}return tr}));window.tableReady=true;window.matchingRows=r.length}const tr=document.createElement('tr');D.columns.forEach((c,i)=>{const th=document.createElement('th');th.textContent=c;th.onclick=()=>{ascending=sort===i?!ascending:true;sort=i;draw()};tr.append(th)});$('head').append(tr);$('search').oninput=()=>{const q=$('search').value.toLowerCase();rows=q?D.rows.filter(r=>r.some(x=>value(x).toLowerCase().includes(q))):D.rows;page=0;draw()};$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};draw()</script></html>

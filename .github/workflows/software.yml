name: Katana tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application from source
        run: python -m pip install -e ".[next,next-dev]"
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Validate software, scientific readers and report routes
        run: >-
          python -m pytest -q
          tests/public_baseline
          tests/v2/test_complete_report.py
          tests/v2/test_report_revision_contract.py
          tests/v2/test_bulk_all_samples_qc.py
          tests/v2/test_read_support_source_policy.py
          tests/v2/test_das_event_selection_policy.py
          tests/v2/test_das_selection_interfaces.py
          tests/v2/test_review_correctness.py
          tests/v2/test_network_all_sample_input_qc.py
          tests/test_qc_array_range_validation.py
          tests/test_cosplice.py::test_qc_requires_complete_counts_but_not_condition_response
          tests/test_cosplice.py::test_qc_records_out_of_range_psi_as_input_ineligible
          tests/v2/test_english_report_policy.py
          tests/v2/test_motiftrace_windows.py
          tests/v2/test_motiftrace_parallel.py
          tests/v2/test_motiftrace_consequences.py
          tests/v2/test_frozen_psi.py
          tests/v2/test_psi_enhancement.py
          tests/v2/test_cosplice_empty_optional_table.py
          tests/v2/test_cosplice_reference_cache.py
          tests/v2/test_hub_source_configuration.py
          tests/test_cosplice.py::test_audit_and_matrix_preserve_sample_order
          tests/test_cosplice.py::test_tom_backbone_strengthens_shared_neighbors
          tests/test_cosplice.py::test_metadata_rejects_duplicate_normalized_sample_ids
          tests/test_cosplice.py::test_project_facade_exposes_contracts_without_running_analysis
          tests/test_runtime_discovery.py
          tests/test_portable_report_metadata.py
      - name: Validate browser entry and compatibility routes
        run: >-
          python -m pytest -q
          tests/v2/test_launcher.py
          tests/v2/test_interface_scroll.py
          -k "not real_pythonw"

  package-wheel:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      KATANA_WHEEL_ONLY: '1'
      KATANA_REQUIRE_WEB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build browser for the wheel
        working-directory: apps/web
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build and install a wheel with report and MotifTrace dependencies
        run: |
          python -m pip install build pytest
          python -m build --wheel
          python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[motiftrace,report,targets,next]'])"
          python -m pip check
      - name: Test installed resources outside the source checkout
        run: |
          cp tests/public_baseline/test_motiftrace_distribution.py "$RUNNER_TEMP/test_motiftrace_distribution.py"
          cp tests/public_baseline/test_report_distribution.py "$RUNNER_TEMP/test_report_distribution.py"
          cp tests/public_baseline/test_target_distribution.py "$RUNNER_TEMP/test_target_distribution.py"
          cp tests/public_baseline/test_flow_distribution.py "$RUNNER_TEMP/test_flow_distribution.py"
          cd "$RUNNER_TEMP"
          python -I -m pytest -q test_motiftrace_distribution.py test_report_distribution.py test_target_distribution.py test_flow_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-wheel-linux
          path: dist/*.whl

  windows-wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel with Windows filesystem metadata
        run: |
          python -m pip install build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: public-wheel-windows
          path: dist/*.whl

  installed-native-import:
    needs: [package-wheel, windows-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build-os: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: public-wheel-${{ matrix.build-os }}
          path: dist
      - name: Build an independent controller from the unchanged wheel
        run: |
          python tools/runtime/build_portable_controller.py --wheel dist/*.whl --constraints environments/locks/pip-linux-64.lock --outdir "$RUNNER_TEMP/controller-build"
          mkdir "$RUNNER_TEMP/relocated"
          tar xzf "$RUNNER_TEMP"/controller-build/*.tar.gz -C "$RUNNER_TEMP/relocated"
      - name: Test installed scripts, production R modules and native resume
        run: |
          bundle="$RUNNER_TEMP/relocated/katana-controller"
          "$bundle/python/bin/python3" -I tools/runtime/check_portable_controller.py "$bundle" "$RUNNER_TEMP/handoff"
          command=$(python -c 'import json,os; print(json.dumps([os.environ["RUNNER_TEMP"]+"/relocated/katana-controller/bin/nextflow"]))')
          "$bundle/python/bin/python3" -I tools/runtime/check_installed_pipeline.py --outdir "$RUNNER_TEMP/installed-import" --nextflow-command-json "$command"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-native-${{ matrix.build-os }}
          path: |
            ${{ runner.temp }}/controller-build/*
            ${{ runner.temp }}/handoff/*.json
            ${{ runner.temp }}/handoff/*.tsv
            ${{ runner.temp }}/installed-import/*.json
            ${{ runner.temp }}/installed-import/*.log
            ${{ runner.temp }}/installed-import/*.tsv
            ${{ runner.temp }}/installed-import/work/**/.command.*
          include-hidden-files: true

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked interface dependencies
        run: pnpm install --frozen-lockfile
      - name: Test interface
        run: pnpm test
      - name: Build interface
        run: pnpm build

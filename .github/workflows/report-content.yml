name: Report content and module browser
on:
  workflow_dispatch:
  push:
    paths:
      - 'katana_next/reports/**'
      - 'tests/public_baseline/test_report_content_visibility.py'
      - '.github/workflows/report-content.yml'
      - 'scripts/*report*dummy*'
      - 'scripts/report_content_fixture.py'
permissions:
  contents: read
jobs:
  report-browser:
    runs-on: ubuntu-latest
    env:
      KATANA_REPORT_BROWSER_TEST: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[next,next-dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/public_baseline/test_report_content_visibility.py
      - run: python scripts/build_integration_review_dummy.py --content-review --outdir dummy-review
      - run: python scripts/check_integration_review_dummy.py --content-review --directory dummy-review/report --receipt dummy-review/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-chapter-content-review
          path: dummy-review/
          retention-days: 7

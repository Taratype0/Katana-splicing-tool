name: Contract checkpoint
on:
  push:
    branches: [main, 'codex/**']
    paths: ['development/**', '.github/workflows/contracts.yml']
  pull_request:
    paths: ['development/**', '.github/workflows/contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: development
    env:
      PYTHONPATH: source
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-contracts.txt
      - run: python -B -m pytest -q -p no:cacheprovider source/tests/contracts
      - run: python -B -m katana_next.contracts validate source/examples/contracts/v1/bulk-native-import.project.json --verify-hashes

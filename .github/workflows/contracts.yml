name: Katana input contract development

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'katana_next/contracts/**'
      - 'katana_next/domain/**'
      - 'tests/contracts/**'
      - 'examples/contracts/**'
      - 'docs/development/contracts/**'
      - 'pyproject.toml'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'katana_next/contracts/**'
      - 'katana_next/domain/**'
      - 'tests/contracts/**'
      - 'examples/contracts/**'
      - 'docs/development/contracts/**'
      - 'pyproject.toml'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install source-command validation dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' 'pydantic>=2.9,<3' 'numpy>=1.26,<3' 'pytest>=8.3,<10'
      - name: Validate metadata and design contracts
        run: python -B -m pytest -q -p no:cacheprovider tests/contracts
      - name: Check exchange contract and local hashes
        run: python -B -m katana_next.contracts validate examples/contracts/v1/bulk-native-import.project.json --verify-hashes
      - name: Check multi-lane identity mapping
        run: python -B -m katana_next.contracts samplesheets --input examples/contracts/sample-identity-v1/fastq-multilane/upstream.csv --metadata examples/contracts/sample-identity-v1/fastq-multilane/metadata.csv --format fastq
      - name: Check only the requested comparison
        run: python -B -m katana_next.contracts contrasts --metadata examples/contracts/selected-contrasts-v1/selected-subset.metadata.csv --contrasts examples/contracts/selected-contrasts-v1/selected-subset.contrasts.csv --route bulk_complete

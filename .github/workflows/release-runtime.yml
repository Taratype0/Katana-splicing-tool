name: Validate release runtime
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release containing the candidate wheel
        required: true
      runtime_version:
        description: Candidate wheel version
        required: true
      wheel_sha256:
        description: Candidate wheel SHA256
        required: true
      software_run:
        description: Software CI run with accepted wheel and installed-controller jobs
        required: true
permissions:
  contents: write
  actions: read
jobs:
  docker-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      SOFTWARE_RUN: ${{ inputs.software_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain verified wheel, controller and runtime base
        run: bash tools/runtime/release_runtime.sh prepare
      - name: Build and verify installed candidate image
        run: bash tools/runtime/release_runtime.sh build
      - name: Verify native container execution and cache reuse
        run: |
          python pipeline/tools/check_container_runtime.py --image "katana-downstream:$RUNTIME_VERSION" --nextflow "$CONTROLLER/bin/nextflow" --outdir "$RUNNER_TEMP/katana-release/output/native-runtime"
      - name: Verify generated-file writes and installed public import
        run: |
          docker run --rm --network=none --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/katana-release/output:/acceptance" -v "$GITHUB_WORKSPACE/tools/runtime:/checks:ro" "katana-downstream:$RUNTIME_VERSION" python /checks/check_import_content.py --outdir /acceptance/import-content
      - name: Verify installed standalone models and approved report
        run: bash tools/runtime/release_runtime.sh models
      - name: Verify approved enrichment figures from the installed image
        run: |
          docker run --rm --network=none -e MPLCONFIGDIR=/tmp/matplotlib -v "$RUNNER_TEMP/katana-release/output:/acceptance" -v "$GITHUB_WORKSPACE/tools/runtime:/checks:ro" "katana-downstream:$RUNTIME_VERSION" python -I /checks/check_report_format.py --outdir /acceptance/approved-report
      - name: Verify installed native DAG, models, report, delivery and resume
        run: |
          "$CONTROLLER/python/bin/python3" -I tools/runtime/check_native_models.py --image "katana-downstream:$RUNTIME_VERSION" --nextflow "$CONTROLLER/bin/nextflow" --outdir "$RUNNER_TEMP/katana-release/output/native-models"
      - name: Authenticate release image publication
        uses: docker/login-action@v3
        with:
          username: j387735517
          password: ${{ secrets.KATANA_RELEASE_DOCKERHUB_TOKEN }}
      - name: Publish validated versioned Docker image
        run: |
          docker tag "katana-downstream:$RUNTIME_VERSION" "docker.io/j387735517/katana-downstream:$RUNTIME_VERSION"
          docker push "docker.io/j387735517/katana-downstream:$RUNTIME_VERSION"
          docker inspect "docker.io/j387735517/katana-downstream:$RUNTIME_VERSION" > "$RUNNER_TEMP/katana-release/output/registry-image-inspect.json"
      - name: Preserve validated Docker runtime in draft release
        run: bash tools/runtime/release_runtime.sh collect-docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-runtime-checks
          path: |
            ${{ runner.temp }}/katana-release/output/**/*.json
            ${{ runner.temp }}/katana-release/output/**/*.log
            ${{ runner.temp }}/katana-release/output/**/*.tsv
            ${{ runner.temp }}/katana-release/output/*SUMS
          retention-days: 7

  apptainer-runtime:
    needs: docker-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      WHEEL_SHA: ${{ inputs.wheel_sha256 }}
      SOFTWARE_RUN: ${{ inputs.software_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify SIF from the accepted Docker archive
        run: bash tools/runtime/release_runtime.sh apptainer
      - name: Preserve complete runtime acceptance in draft release
        run: bash tools/runtime/release_runtime.sh collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apptainer-checks
          path: |
            ${{ runner.temp }}/katana-release/output/**/*.json
            ${{ runner.temp }}/katana-release/output/**/*.log
            ${{ runner.temp }}/katana-release/output/*SUMS
          retention-days: 7

name: Verify accepted release assets
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload-accepted-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 38eb64631a9c0997c93bc7992a92a93c881218c1
      - name: Verify accepted source and existing draft
        run: |
          python - <<'PY'
          import subprocess,json
          repo='Taratype0/Katana-splicing-tool';head='38eb64631a9c0997c93bc7992a92a93c881218c1'
          for id in (41700183693,41700216459,41700224428):
              r=json.loads(subprocess.check_output(['gh','run','view',str(id),'--repo',repo,'--json','headSha,status,conclusion']))
              assert r==dict(headSha=head,status='completed',conclusion='success'),r
          r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v2.0.0-beta.5.dev2026110306']))
          assert r['draft'] and r['target_commitish']==head
          PY
      - uses: actions/download-artifact@v4
        with:
          name: installed-native-linux
          run-id: 41700183693
          github-token: ${{ github.token }}
          path: accepted/controller
      - uses: actions/download-artifact@v4
        with:
          name: upstream-resource-policy
          run-id: 41700216459
          github-token: ${{ github.token }}
          path: accepted/native/upstream-resource-policy
      - uses: actions/download-artifact@v4
        with:
          name: paired-native-models
          run-id: 41700216459
          github-token: ${{ github.token }}
          path: accepted/native/paired-native-models
      - name: Verify installed payload and upload only accepted assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile,hashlib,json,subprocess
          root=Path('accepted');files=list((root/'controller').rglob('*linux-x86_64.tar.gz'));assert len(files)==1,files
          archive=files[0];head='38eb64631a9c0997c93bc7992a92a93c881218c1'
          checked=[]
          with tarfile.open(archive) as tar:
              for source in ('pipeline/modules/local/rmats_prep_bam.nf','pipeline/vendor/dexseq/dexseq_count.py','pipeline/conf/upstream_task_resources.config','pipeline/conf/portable_resources.config','pipeline/conf/pdc_kth.config','pipeline/conf/task_resources.config','pipeline/assets/measured-resources.json','pipeline/assets/resource-policy.json','pipeline/nextflow.config','pipeline/bin/katana_configure.py','pipeline/subworkflows/local/dexseq_deu.nf'):
                  matches=[m for m in tar.getmembers() if m.name.endswith('/_pipeline/'+source.removeprefix('pipeline/'))]
                  assert len(matches)==1,(source,len(matches))
                  content=tar.extractfile(matches[0]).read();assert content==Path(source).read_bytes(),source
                  checked.append(dict(path=source,sha256=hashlib.sha256(content).hexdigest()))
              matches=[m for m in tar.getmembers() if m.name.endswith('/katana_next/targets/bundle.py')];assert len(matches)==1
              assert tar.extractfile(matches[0]).read()==Path('katana_next/targets/bundle.py').read_bytes()
          with archive.open('rb') as f:sha=hashlib.file_digest(f,'sha256').hexdigest()
          evidence=[]
          for p in (root/'native').rglob('*.json'):
              try: content=json.loads(p.read_text())
              except ValueError: continue
              evidence.append(dict(path=str(p.relative_to(root/'native')),record=content))
          assert evidence
          record=dict(status='passed',source_commit=head,software_run=41700183693,native_run=41700216459,controller=dict(filename=archive.name,bytes=archive.stat().st_size,sha256=sha),packaged_sources=checked,native_evidence=evidence,rebuild=False)
          receipt=Path('CONTROLLER_VALIDATION.json');receipt.write_text(json.dumps(record,indent=2)+'\n')
          subprocess.run(['gh','release','upload','v2.0.0-beta.5.dev2026110306',str(archive),str(receipt),'--repo','Taratype0/Katana-splicing-tool'],check=True)
          print(json.dumps(dict(status='uploaded_verified_controller',**record['controller'])))
          PY

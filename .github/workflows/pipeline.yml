name: Native Nextflow integration

on:
  push:
    paths:
      - 'pipeline/**'
      - 'nextflow.config'
      - 'katana_next/flow/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/pipeline.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'nextflow.config'
      - 'katana_next/flow/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

jobs:
  native-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify fixed Nextflow runtime
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/nextflow-io/nextflow/releases/download/v25.10.4/nextflow-25.10.4-dist \
            --output "$RUNNER_TEMP/nextflow-25.10.4-dist"
          echo "60db869a7618783e3ee60183a2b0c6c50ffc67221eabec60800b904991786aaa  $RUNNER_TEMP/nextflow-25.10.4-dist" | sha256sum --check --strict
      - name: Verify effective upstream allocations, aliases and user overrides
        env:
          NXF_OFFLINE: 'true'
        shell: bash
        run: |
          python -c 'import json,os; print(json.dumps(["java", "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=java.base/java.util=ALL-UNNAMED", "-cp", os.environ["RUNNER_TEMP"] + "/nextflow-25.10.4-dist", "nextflow.cli.Launcher"]))' > "$RUNNER_TEMP/resource-nextflow-command.json"
          python -B pipeline/tools/check_upstream_resources.py \
            --nextflow-command-file "$RUNNER_TEMP/resource-nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-upstream-resource-policy"
      - name: Verify reference exclusions
        run: python -B -m unittest discover -s pipeline/tests -p test_reference_filter.py -v
      - name: Verify strandedness classification and contrast gates
        run: python -B -m unittest discover -s pipeline/tests -p test_strandedness.py -v
      - name: Verify lane identity, paired samples and compressed-read merging
        run: python -B -m unittest discover -s pipeline/tests -p test_lanes.py -v
      - name: Verify upstream source snapshot and explicit integration changes
        run: python -B pipeline/tools/verify_sources.py
      - name: Verify native scheduling, failure, resume and reference task
        env:
          NXF_OFFLINE: 'true'
        shell: bash
        run: |
          runtime_command=$(python -c 'import json,os; print(json.dumps(["java", "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=java.base/java.util=ALL-UNNAMED", "-cp", os.environ["RUNNER_TEMP"] + "/nextflow-25.10.4-dist", "nextflow.cli.Launcher"]))')
          printf '%s\n' "$runtime_command" > "$RUNNER_TEMP/nextflow-command.json"
          python -B pipeline/tools/check_launch_download.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-launch-download"
          python -B pipeline/tools/check_native_parameters.py \
            --nextflow-command-json "$RUNNER_TEMP/nextflow-command.json" \
            --repository-entry --outdir "$RUNNER_TEMP/katana-flat-parameters"
          python -B pipeline/tools/check_native_transport.py \
            --nextflow-command-json "$runtime_command" \
            --outdir "$RUNNER_TEMP/katana-native-transport"
          python -B pipeline/tools/check_reference_preparation.py \
            --nextflow-command-json "$runtime_command" \
            --outdir "$RUNNER_TEMP/katana-reference-preparation"
          python -B pipeline/tools/check_export_order.py \
            --nextflow-command-json "$runtime_command" \
            --outdir "$RUNNER_TEMP/katana-export-order"
          python -B pipeline/tools/check_strandedness_auto.py \
            --nextflow-command-json "$runtime_command" \
            --outdir "$RUNNER_TEMP/katana-auto-strandedness"
          KATANA_NEXTFLOW_COMMAND_JSON="$runtime_command" python -B -m unittest discover \
            -s pipeline/tests -p test_storage_publish.py -v
          KATANA_NEXTFLOW_COMMAND_JSON="$runtime_command" python -B -m unittest discover \
            -s pipeline/tests -p test_standard_outputs.py -v
          python -B pipeline/tools/check_managed_storage.py \
            --nextflow-command-json "$runtime_command" \
            --outdir "$RUNNER_TEMP/katana-managed-storage"
          printf '%s\n' "$runtime_command" > "$RUNNER_TEMP/nextflow-command.json"
          python -B pipeline/tools/check_rmats_sample_reuse.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-rmats-sample-reuse"
          python -B pipeline/tools/check_native_lanes.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --pipeline pipeline --outdir "$RUNNER_TEMP/katana-native-lanes"
          python -B pipeline/tools/check_native_lanes.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --pipeline pipeline --format tsv --outdir "$RUNNER_TEMP/katana-native-lanes-tsv"
          python -B pipeline/tools/check_resource_resume.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-resource-resume"

          python -B pipeline/tools/check_resource_policy.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-resource-policy"

          python -B pipeline/tools/check_native_cache_scope.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-cache-scope"

          python -B pipeline/tools/check_unified_cleanup.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-unified-cleanup"
          python -B pipeline/tools/check_paired_transport.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-paired-transport"
          python -B pipeline/tools/check_single_session_entry.py \
            --nextflow-command-file "$RUNNER_TEMP/nextflow-command.json" \
            --outdir "$RUNNER_TEMP/katana-single-session"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-resource-policy
          path: |
            ${{ runner.temp }}/katana-upstream-resource-policy/acceptance.receipt.json
            ${{ runner.temp }}/katana-upstream-resource-policy/*/stdout.txt
            ${{ runner.temp }}/katana-upstream-resource-policy/*/stderr.txt
            ${{ runner.temp }}/katana-rmats-sample-reuse/receipt.json
            ${{ runner.temp }}/katana-rmats-sample-reuse/*/*.log
            ${{ runner.temp }}/katana-rmats-sample-reuse/*/*.tsv
            ${{ runner.temp }}/katana-flat-parameters/*.txt
            ${{ runner.temp }}/katana-launch-download/acceptance.json
            ${{ runner.temp }}/katana-launch-download/*.log
            ${{ runner.temp }}/katana-export-order/acceptance.json
            ${{ runner.temp }}/katana-export-order/*.log
          retention-days: 7

  paired-native-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published Katana DEXSeq image and original staged scripts
        run: |
          mkdir -p "$RUNNER_TEMP/paired-models"
          image='docker.io/j387735517/katana-dexseq-tools@sha256:20efe62e4679d6437c21938c624f7fdb18cc3c7fa8289456e1a73d9086b29717'
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/containers:/checks:ro" "$image" \
            python /checks/dexseq-tools/check_runtime.py > "$RUNNER_TEMP/paired-models/katana-dexseq-bundled.json"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e KATANA_DEXSEQ_SCRIPTS=/pipeline/vendor/dexseq \
            -v "$PWD/pipeline:/pipeline:ro" -v "$PWD/containers:/checks:ro" \
            "$image" \
            python /checks/dexseq-tools/check_runtime.py > "$RUNNER_TEMP/paired-models/katana-dexseq-staged.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare grouped and per-BAM rMATS prep on generated junction reads
        run: |
          python -m pip install pysam==0.23.3
          python -B pipeline/tools/check_rmats_prep_equivalence.py --outdir "$RUNNER_TEMP/paired-models/rmats-equivalence"
      - name: Fit generated paired counts in the upstream DEXSeq runtime
        run: |
          mkdir -p "$RUNNER_TEMP/paired-models"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e R_BIOC_WORKERS=1 -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            -v "$PWD/pipeline:/pipeline:ro" -v "$RUNNER_TEMP/paired-models:/output" \
            quay.io/biocontainers/bioconductor-dexseq:1.36.0--r40_0 \
            Rscript /pipeline/tests/paired_models.R /pipeline/bin /output/models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-native-models
          path: ${{ runner.temp }}/paired-models
          retention-days: 7

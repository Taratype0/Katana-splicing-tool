[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "katana-splicing-tool"
version = "1.2.3"
description = "Interactive local RNA splicing and transcriptome integration tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
  "bamnostic>=1.3",
  "numpy>=1.26,<2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "seaborn>=0.13",
  "scipy>=1.11,<1.13",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "igraph>=1.0",
  "leidenalg>=0.12",
  "statsmodels>=0.14",
  "dynamicTreeCut==0.1.1",
]

[project.scripts]
katana-cosplice = "katana_cosplice.cli:main"
katana-cosplice-publication-benchmark = "katana_cosplice.publication_benchmark:main"
katana-cosplice-input-benchmark = "katana_cosplice.input_mode_benchmark:main"
katana-cosplice-locked-ablation = "scripts.run_locked_three_arm_ablation:main"
katana-cosplice-locked-panel-report = "katana_cosplice.locked_panel_report:main"
katana-cosplice-real-count-ablation = "scripts.run_real_count_four_arm_ablation:main"
katana-cosplice-membership-validation = "scripts.validate_membership_confidence_panel:main"

[tool.setuptools]
packages = ["app", "app.pages", "app.widgets", "katana_cosplice", "scripts", "src", "src.analysis", "src.adapters", "src.domain", "src.domain.models", "src.domain.rules", "src.io", "src.io.loaders", "src.services", "src.visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".venv",
  "build",
  "dist",
  "katana_output",
  "software",
]
python_files = ["test_*.py"]

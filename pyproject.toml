[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "katana-splicing-tool"
version = "0.1.0"
description = "Interactive local RNA splicing and transcriptome integration tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
  "bamnostic>=1.3",
  "numpy>=1.26,<2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "seaborn>=0.13",
  "scipy>=1.11,<1.13",
  "statsmodels>=0.14",
]

[tool.setuptools]
packages = ["app", "app.pages", "app.widgets", "src", "src.analysis", "src.adapters", "src.domain", "src.domain.models", "src.domain.rules", "src.io", "src.io.loaders", "src.services", "src.visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".venv",
  "build",
  "dist",
  "katana_output",
  "software",
]
python_files = ["test_*.py"]
